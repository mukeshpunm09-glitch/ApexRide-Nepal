{% extends "base.html" %}{% block title %}Login — ApexRide Nepal{% endblock %}
{% block content %}
<section class="section container"><div class="card form-card reveal" style="max-width:520px">
  <p class="eyebrow">Welcome Back</p><h1>Log In</h1>
  <form method="post" class="mt">
    <div class="field"><label>Email *</label><input type="email" name="email" required placeholder="you@example.com"></div>
    <div class="field"><label>Password *</label><input type="password" name="password" required placeholder="Your password"></div>
    <button class="btn btn-primary btn-block" type="submit">🔑 Log In</button>
  </form>
  <p class="center mt">No account? <a href="{{ url_for('auth.register') }}" style="color:var(--gold2)">Register free</a></p>
  <p class="center" style="font-size:.88rem">Demo — owner@apexride.com.np / customer@apexride.com.np<br>Password: <b>apexride123</b></p>
</div></section>
{% endblock %}
